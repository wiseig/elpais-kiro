<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Preguntale a El País</title>
    <meta
      name="description"
      content="Preguntale a El País: un asistente que responde tus preguntas usando únicamente notas publicadas por El País (Uruguay), citando cada fuente."
    />
    <meta name="theme-color" content="#004f88" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pelp.theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          if (!theme) {
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            theme = systemDark ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b1220' : '#004f88');
        } catch (e) {
          // Sin localStorage o matchMedia: se queda con el tema claro por defecto.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;600;700&family=Roboto:wght@400;500;700&family=Work+Sans:wght@400;600&family=Nunito:ital,wght@1,700&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="El País" />
    <meta property="og:title" content="Preguntale a El País" />
    <meta
      property="og:description"
      content="Respuestas elaboradas únicamente con notas de El País, con sus fuentes."
    />
    <meta property="og:image" content="/og_elpais.jpg" />
    <meta property="og:locale" content="es_UY" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
